# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  gateway-rs:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile.dev
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready >/dev/null || exit 1"]
      start_period: 60s

  signal:
    build:
      context: ./services/signal
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./services/signal:/app
    environment:
      WHISPER_MODEL: base
      LOG_LEVEL: DEBUG

  ml-worker:
    build:
      context: ./services/signal
      dockerfile: Dockerfile.ml.dev
    command: python -m worker.transcriber
    volumes:
      - ./services/signal:/app
      - whisper-cache:/root/.cache/whisper
    environment:
      WHISPER_MODEL: base
      LOG_LEVEL: DEBUG
