version: '3.9'

# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Overrides prod settings for local development.

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  gateway-rs:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile.dev
    ports:
      - "3000:3000"
    healthcheck:
      start_period: 60s   # debug builds start slower than release

  signal:
    build:
      context: ./services/signal
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./services/signal:/app
    environment:
      WHISPER_MODEL: base
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelmesh
      LOG_LEVEL: DEBUG

  ml-worker:
    build:
      context: ./services/signal
      dockerfile: Dockerfile.ml.dev
    command: python -m worker.transcriber
    volumes:
      - ./services/signal:/app
      - whisper-cache:/root/.cache/whisper
    environment:
      WHISPER_MODEL: base
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelmesh
      LOG_LEVEL: DEBUG

volumes:
  whisper-cache:
