version: '3.9'

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./services/gateway/src:/app/src
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

  signal:
    build:
      context: ./services/signal
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./services/signal:/app
    environment:
      WHISPER_MODEL: base
