upstream gateway {
  server gateway-rs:3000;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $trusted_forwarded_proto {
  '' $scheme;
  http http;
  https https;
  default $scheme;
}

map $http_x_forwarded_port $trusted_forwarded_port {
  '' $server_port;
  ~^\d{1,5}$ $http_x_forwarded_port;
  default $server_port;
}

# The only production listener is loopback-bound behind the host TLS proxy.
# Docker bridge sources are trusted to replace, not append, forwarding headers.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location /api/ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_set_header X-Forwarded-Port $trusted_forwarded_port;
    proxy_read_timeout 30s;
  }

  location /ws {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_set_header X-Forwarded-Port $trusted_forwarded_port;
    proxy_read_timeout 86400s;
  }

  location ~ ^/(health|live|ready)$ {
    proxy_pass http://gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    proxy_read_timeout 5s;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~ ^/(sw\.js|push-sw\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
