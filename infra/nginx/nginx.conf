events { worker_connections 1024; }

http {
  upstream gateway {
    server gateway:3000;
  }

  # Send "upgrade" header only when client actually requested an upgrade.
  # Plain REST requests get "close" instead, which is correct per HTTP spec.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # REST API — tight timeout so a slow handler doesn't hold workers indefinitely
    location /api/ {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }

    # WebSocket — long timeout to keep persistent connections alive
    location /ws {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    # Everything else (health endpoint, static assets)
    location / {
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 30s;
    }
  }
}
