services:
  postgres:
    build:
      context: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelmesh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?set APP_DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD=$$APP_DATABASE_PASSWORD psql -U sentinel_app -d sentinelmesh -tAc "SELECT 1" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    build:
      context: ./infra/postgres
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: sentinelmesh
      POSTGRES_USER: postgres
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
    command: ["/usr/local/bin/sentinel-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-rs:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sentinel_app:${APP_DATABASE_PASSWORD}@postgres:5432/sentinelmesh
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?set INTERNAL_SERVICE_SECRET}
      CIRCLE_TOKEN_SECRET: ${CIRCLE_TOKEN_SECRET:?set CIRCLE_TOKEN_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      TRUST_PROXY: "true"
      MAP_API_ENABLED: ${MAP_API_ENABLED:-false}
      STADIA_API_KEY: ${STADIA_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      PINATA_JWT: ${PINATA_JWT:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      SYNTHESIS_ENABLED: ${SYNTHESIS_ENABLED:-false}
      ACOUSTIC_CONFIRM_ENABLED: ${ACOUSTIC_CONFIRM_ENABLED:-false}
      NLP_SYNTHESIS_ENABLED: ${NLP_SYNTHESIS_ENABLED:-true}
      CONSENSUS_REQUIRE_ESTABLISHED: ${CONSENSUS_REQUIRE_ESTABLISHED:-true}
      MAX_DB_CONNECTIONS: ${MAX_DB_CONNECTIONS:-50}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://tiles.stadiamaps.com/data/openmaptiles.json}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
        VITE_ENABLE_EXPERIMENTAL_ACOUSTIC: ${VITE_ENABLE_EXPERIMENTAL_ACOUSTIC:-false}
        VITE_ENABLE_EXPERIMENTAL_CIRCLES: ${VITE_ENABLE_EXPERIMENTAL_CIRCLES:-false}
        VITE_ENABLE_EXPERIMENTAL_INSIGHTS: ${VITE_ENABLE_EXPERIMENTAL_INSIGHTS:-false}
        VITE_ENABLE_EXPERIMENTAL_PHOTOS: ${VITE_ENABLE_EXPERIMENTAL_PHOTOS:-false}
        VITE_ENABLE_EXPERIMENTAL_ROUTING: ${VITE_ENABLE_EXPERIMENTAL_ROUTING:-false}
    restart: unless-stopped
    ports:
      - "${SENTINEL_BIND_ADDRESS:-0.0.0.0}:${SENTINEL_HTTP_PORT:-80}:8080"
    depends_on:
      gateway-rs:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  signal:
    profiles: ["signal"]
    build:
      context: ./services/signal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: signal-api
      DATABASE_URL: postgresql://sentinel_app:${APP_DATABASE_PASSWORD}@postgres:5432/sentinelmesh
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  ml-worker:
    profiles: ["ml"]
    build:
      context: ./services/signal
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    environment:
      SERVICE_NAME: ml-worker
      DATABASE_URL: postgresql://sentinel_app:${APP_DATABASE_PASSWORD}@postgres:5432/sentinelmesh
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - whisper-cache:/home/sentinel/.cache/whisper
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G

volumes:
  pgdata:
  redisdata:
  whisper-cache:
