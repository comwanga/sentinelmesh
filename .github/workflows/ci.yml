name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
      - name: Rust fmt
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust build
        run: cargo build --workspace --locked
      - name: Rust tests
        run: cargo test --workspace --locked

  pwa:
    name: PWA (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Install
        run: npm ci
      - name: PWA build (tsc + vite)
        run: npm run build
      - name: PWA tests (with coverage)
        run: npx vitest run --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-coverage
          path: apps/pwa/coverage
          if-no-files-found: warn

  signal:
    name: Signal (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements.api.txt -r requirements.dev.txt pytest-cov
      - name: pytest
        run: pytest -q --junitxml=pytest-junit.xml --cov=. --cov-report=xml --cov-report=term
      - name: Upload test + coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-test-results
          path: |
            services/signal/pytest-junit.xml
            services/signal/coverage.xml
          if-no-files-found: warn

  migrations:
    name: V2 schema and role validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelmesh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d sentinelmesh -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE sentinel_app LOGIN NOINHERIT PASSWORD 'ci-runtime-password';
          CREATE ROLE sentinel_reputation NOLOGIN NOINHERIT;
          GRANT sentinel_reputation TO sentinel_app WITH INHERIT FALSE;
          SQL
      - name: Apply clean V2 baseline and forward migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d sentinelmesh -v ON_ERROR_STOP=1 -f infra/postgres/schema-v2.sql
          POSTGRES_HOST=localhost POSTGRES_DB=sentinelmesh POSTGRES_USER=postgres \
            POSTGRES_ADMIN_PASSWORD=postgres MIGRATIONS_DIR="$PWD/infra/postgres/migrations-v2" \
            sh infra/postgres/migrate.sh
          POSTGRES_HOST=localhost POSTGRES_DB=sentinelmesh POSTGRES_USER=postgres \
            POSTGRES_ADMIN_PASSWORD=postgres MIGRATIONS_DIR="$PWD/infra/postgres/migrations-v2" \
            sh infra/postgres/migrate.sh
      - name: Probe runtime role and RLS boundary
        env:
          PGPASSWORD: ci-runtime-password
        run: |
          set -euo pipefail
          test "$(psql -h localhost -U sentinel_app -d sentinelmesh -Atc 'SELECT MAX(version) FROM schema_versions')" = 5
          test "$(psql -h localhost -U sentinel_app -d sentinelmesh -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND column_name IN ('bitcoin_txid','bitcoin_block','anchor_hash')")" = 0
          test "$(psql -h localhost -U sentinel_app -d sentinelmesh -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('publish_jobs','publish_failures','utxos')")" = 0
          test "$(psql -h localhost -U sentinel_app -d sentinelmesh -Atc "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'users' AND column_name IN ('nip05_identifier','nip05_verified_at','nip05_valid_until')")" = 3
          psql -h localhost -U sentinel_app -d sentinelmesh -v ON_ERROR_STOP=1 -c "SELECT PostGIS_Version()"
          if psql -h localhost -U sentinel_app -d sentinelmesh -c "DELETE FROM schema_versions"; then
            echo "sentinel_app unexpectedly modified migration history" >&2
            exit 1
          fi
          if psql -h localhost -U sentinel_app -d sentinelmesh -c "SELECT * FROM report_authors"; then
            echo "sentinel_app unexpectedly read report_authors" >&2
            exit 1
          fi
          psql -h localhost -U sentinel_app -d sentinelmesh -v ON_ERROR_STOP=1 -c "SET ROLE sentinel_reputation; SELECT * FROM report_authors"
          PGPASSWORD=postgres pg_dump -h localhost -U postgres -d sentinelmesh --format=custom --no-owner -f /tmp/sentinelmesh.dump
          PGPASSWORD=postgres createdb -h localhost -U postgres sentinelmesh_restore
          PGPASSWORD=postgres pg_restore -h localhost -U postgres -d sentinelmesh_restore --exit-on-error --no-owner /tmp/sentinelmesh.dump
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d sentinelmesh_restore -Atc 'SELECT MAX(version) FROM schema_versions')" = 5
          echo "V2 schema and runtime role boundary validated." >> "$GITHUB_STEP_SUMMARY"
      - name: Operations migration and restore smoke test
        run: ./tests/operations-smoke.sh
