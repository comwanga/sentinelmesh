name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services
      - name: Rust fmt
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust build
        run: cargo build --workspace --locked
      - name: Rust tests
        run: cargo test --workspace --locked

  pwa:
    name: PWA (build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - name: Install
        run: npm ci
      - name: PWA build (tsc + vite)
        run: npm run build
      - name: PWA tests (with coverage)
        run: npx vitest run --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-coverage
          path: apps/pwa/coverage
          if-no-files-found: warn

  signal:
    name: Signal (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements.api.txt -r requirements.dev.txt pytest-cov
      - name: pytest
        run: pytest -q --junitxml=pytest-junit.xml --cov=. --cov-report=xml --cov-report=term
      - name: Upload test + coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-test-results
          path: |
            services/signal/pytest-junit.xml
            services/signal/coverage.xml
          if-no-files-found: warn

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelmesh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema + migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          run_sql() { psql -h localhost -U postgres -d sentinelmesh -v ON_ERROR_STOP=1 -f "$1"; }
          echo "Applying init.sql"
          run_sql infra/postgres/init.sql
          for f in $(ls infra/postgres/migrations/*.sql | sort); do
            echo "Applying $f"
            run_sql "$f"
          done
          echo "All migrations applied cleanly." >> "$GITHUB_STEP_SUMMARY"
